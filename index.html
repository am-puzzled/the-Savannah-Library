
<!DOCTYPE html>
 <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Title  -->
      <title> The Savannah Library | Manage and Explore Books</title>
    <!-- Meta description -->
     <meta name="description" content="The Savannah Library is a simple web app to add, view, update and manage books, Track titles, authors, genres, and publication years with ease" >
     <!-- Keywords -->
      <meta name="keywords" content="Savannah Library, book manager, book collection, JSON web app, library app, online book catalog">
    <!-- Link to CSS -->
      <link rel="stylesheet" href="theSavannahLibrary.css">
  </head>
  <body>

    <!-- Site Title -->
    <h1>The Savannah Library</h1>
    <!-- Books box which will appear like a card -->
    <div class="BooksBox" id="BooksBox">

      <h3>Enter a new Book</h3>
      <!-- form contents..heading and the form itself -->
      <form class="enterCustomBookform" id="enterCustomBookform">
        <input type="text" class="titleBox" id="title" placeholder="Title" required>
        <input type="text" class="authorBox" id="author" placeholder="Author" required>
        <input type="text" class="genreBox" id="genre" placeholder="Genre" required>
        <input type="number" class="yearBox" id="year" placeholder="Year" required>
      

        <button type="submit" class="addBookButton" id="addBookButton">Add Book</button>
      </form>
    </div>


    <div class="forTable" id="forTable">
      <h3>Stored Books</h3>

        <table class="table" id="table">
          <thead>
            <tr class="rowHeadings" id="rowHeadings">
              <th class="title">Title</th>
              <th class="author">Author</th>
              <th class="genre">Genre</th>
              <th class="year">Year</th>
            </tr>
          </thead>

          <tbody id="forOriginalRows" class="forOriginalRows">
            <!-- original rows go here -->
          </tbody>

          <tbody id="forCustomRows" class="forCustomRows">
            <!-- dynamically added rows go here -->
          </tbody>
        </table>

      <!-- container For the buttons -->
      <div class="buttonContainer">
        <button class="update" onclick="updateContent()">update</button>
          <button class="delete" onclick="deleteContent()">delete</button>
      </div>

      <!-- This is where the updating and deleting forms will appear -->
      <div class="newFormArea" id="newFormArea">

      </div>
    
     </div>

    <script src="theSavannahLibrary.js" ></script>
  </body>
  </html>
